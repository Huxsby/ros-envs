# Builds the Docker environment and publishes it to ghcr.io/huxsby/ros-envs-noetic, so that a server only has to
# download it. environments.yml tests the same Dockerfile.
name: Image

on:
  push:
    branches: [main]
    # Only what goes into the image: READMEs, compose and .env.example do not change it
    paths: ['.github/workflows/image.yml', 'docker/noetic/**', '!docker/noetic/*.md', '!docker/noetic/docker-compose.yml', '!docker/noetic/.env.example']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The ROS image with Gazebo is over 4 GB: better not to run short of disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/noetic
          push: true
          tags: |
            ghcr.io/huxsby/ros-envs-noetic:latest
            ghcr.io/huxsby/ros-envs-noetic:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
