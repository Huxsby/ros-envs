# Builds the Docker environments and publishes them to ghcr.io/huxsby/ros-envs-noetic and ros-envs-jazzy, so that a
# server only has to download them. environments.yml tests the same Dockerfiles.
name: Image

on:
  push:
    branches: [main]
    # Only what goes into the image: READMEs, compose and .env.example do not change it
    paths: ['.github/workflows/image.yml', 'docker/**', '!docker/**/*.md', '!docker/**/docker-compose.yml', '!docker/**/.env.example']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        distro: [noetic, jazzy]
    steps:
      # The ROS image with Gazebo is over 4 GB: better not to run short of disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/${{ matrix.distro }}/Dockerfile
          push: true
          tags: |
            ghcr.io/huxsby/ros-envs-${{ matrix.distro }}:latest
            ghcr.io/huxsby/ros-envs-${{ matrix.distro }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}
