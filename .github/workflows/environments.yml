# Installs each environment from scratch and runs its smoke test. On a change, only the group it touches runs, and
# nothing runs for documentation. Everything runs once a week, because most breakage comes from outside (expired keys,
# removed images, packages). By hand, Run workflow can choose one group.
name: Environments

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      group:
        description: Group to run
        type: choice
        options: [all, lint, native, distrobox, docker, wsl]
        default: all

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter lists the files of a pull request through the API

concurrency:
  group: environments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.groups.outputs.lint }}
      native: ${{ steps.groups.outputs.native }}
      distrobox: ${{ steps.groups.outputs.distrobox }}
      docker: ${{ steps.groups.outputs.docker }}
      wsl: ${{ steps.groups.outputs.wsl }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lint: ['**/*.sh', '**/*.ps1']
            native: ['ros/**', 'install.sh', 'ci/**']
            distrobox: ['ros/**', 'distrobox/*.sh', 'install.sh']
            docker: ['ros/*/smoke-test.sh', 'ros/machine.sh', 'docker/*/Dockerfile', 'docker/*/*.sh', 'docker/*/supervisord.conf', 'docker/*/bashrc']
            wsl: ['ros/**', 'wsl/*.ps1', 'install.sh']
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          CHOSEN: ${{ inputs.group }}
          LINT: ${{ steps.filter.outputs.lint }}
          NATIVE: ${{ steps.filter.outputs.native }}
          DISTROBOX: ${{ steps.filter.outputs.distrobox }}
          DOCKER: ${{ steps.filter.outputs.docker }}
          WSL: ${{ steps.filter.outputs.wsl }}
        run: |
          for group in lint native distrobox docker wsl; do
            value=${group^^}
            case $EVENT in
              schedule) run=true ;;
              workflow_dispatch) run=$([ "$CHOSEN" = all ] || [ "$CHOSEN" = "$group" ] && echo true || echo false) ;;
              *) run=${!value} ;;
            esac
            echo "$group=$run" >> "$GITHUB_OUTPUT"
          done

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax and shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          for s in "${scripts[@]}"; do bash -n "$s"; done
          shellcheck -S warning -e SC1090,SC1091 "${scripts[@]}"
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/wsl/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: kinetic, image: 'ubuntu:16.04' }
          - { distro: melodic, image: 'ubuntu:18.04' }
          - { distro: noetic, image: 'ubuntu:20.04' }
          - { distro: jazzy, image: 'ubuntu:24.04' }
    steps:
      - uses: actions/checkout@v5
      - name: Install and test ${{ matrix.distro }}
        run: docker run --rm -v "$PWD:/src:ro" ${{ matrix.image }} bash /src/ci/native.sh ${{ matrix.distro }}

  distrobox:
    needs: changes
    if: needs.changes.outputs.distrobox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [kinetic, melodic, noetic, jazzy]
    steps:
      - uses: actions/checkout@v5
      - name: Install distrobox and podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq distrobox podman
      - name: Create the box
        run: bash install.sh distrobox ${{ matrix.distro }}
      - name: Smoke test
        run: |
          box=ros-${{ matrix.distro }}
          test=$PWD/ros/${{ matrix.distro }}/smoke-test.sh
          distrobox enter "$box" -- bash "$test" || distrobox enter "$box" -- bash "$test"

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        distro: [noetic, jazzy]
    steps:
      # The ROS image with Gazebo is over 4 GB: better not to run short of disk
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/${{ matrix.distro }}/Dockerfile
          load: true
          tags: ros-envs-${{ matrix.distro }}:ci
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}
      - name: Without a password it must refuse to start
        run: |
          if docker run --rm ros-envs-${{ matrix.distro }}:ci; then exit 1; fi
      - name: Start the container
        run: |
          docker run -d --name ros -e PASSWORD=ci -e CONTAINER_USER=ros -v "$PWD:/src:ro" --shm-size=1g ros-envs-${{ matrix.distro }}:ci
          timeout 120 bash -c 'until docker exec ros curl -fsS -o /dev/null http://localhost:8443/healthz; do sleep 2; done'
          timeout 60 bash -c 'until docker exec ros curl -fsS -o /dev/null http://localhost:6080/vnc.html; do sleep 2; done'
      - name: Smoke test
        run: |
          test=/src/ros/${{ matrix.distro }}/smoke-test.sh
          docker exec -u ros ros bash "$test" || docker exec -u ros ros bash "$test"
      - name: Container logs
        if: failure()
        run: docker logs ros

  # Still to be proven on hosted runners, so it does not hold back the other jobs: see Testing in the README
  wsl:
    needs: changes
    if: needs.changes.outputs.wsl == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        distro: [kinetic, melodic, noetic, jazzy]
    env:
      WSL_UTF8: '1'   # wsl.exe writes UTF-16 by default, which shows in the log with a null between letters
    steps:
      - uses: actions/checkout@v5
      - name: Install ${{ matrix.distro }} through wsl/install.ps1
        shell: pwsh
        run: |
          wsl.exe --update
          .\wsl\install.ps1 -Distro ${{ matrix.distro }} -User ci -Ref ${{ github.sha }} -NoPassword
          wsl.exe --list --verbose
      # From the checkout on the Windows side (/mnt/...). Without DISPLAY, as on the other runners: there is no
      # display, and the Jazzy test then renders without one. Repeated once, like the others, because gzserver
      # sometimes crashes on start.
      - name: Smoke test
        shell: pwsh
        run: |
          $name = "ROS-$((Get-Culture).TextInfo.ToTitleCase('${{ matrix.distro }}'))"
          $test = 'ros/${{ matrix.distro }}/smoke-test.sh'
          wsl.exe -d $name --cd $PWD -- env -u DISPLAY -u WAYLAND_DISPLAY bash $test
          if ($LASTEXITCODE -ne 0) { wsl.exe -d $name --cd $PWD -- env -u DISPLAY -u WAYLAND_DISPLAY bash $test }
          exit $LASTEXITCODE
