# Installs each environment from scratch and runs its smoke test. On a change, only the group it touches runs;
# everything runs once a week, because most breakage comes from outside (expired keys, removed images, packages).
name: Environments

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: environments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.groups.outputs.native }}
      distrobox: ${{ steps.groups.outputs.distrobox }}
      docker: ${{ steps.groups.outputs.docker }}
      wsl: ${{ steps.groups.outputs.wsl }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native: ['ros/**', 'install.sh', 'ci/**', '.github/workflows/environments.yml']
            distrobox: ['ros/**', 'distrobox/**', 'install.sh', '.github/workflows/environments.yml']
            docker: ['ros/noetic/smoke-test.sh', 'ros/machine.sh', 'docker/**', '.github/workflows/environments.yml']
            wsl: ['ros/**', 'wsl/**', 'install.sh', '.github/workflows/environments.yml']
      - id: groups
        env:
          ALL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          NATIVE: ${{ steps.filter.outputs.native }}
          DISTROBOX: ${{ steps.filter.outputs.distrobox }}
          DOCKER: ${{ steps.filter.outputs.docker }}
          WSL: ${{ steps.filter.outputs.wsl }}
        run: |
          for group in native distrobox docker wsl; do
            value=${group^^}
            echo "$group=$([ "$ALL" = true ] && echo true || echo "${!value}")" >> "$GITHUB_OUTPUT"
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bash syntax and shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          for s in "${scripts[@]}"; do bash -n "$s"; done
          shellcheck -S warning -e SC1090,SC1091 "${scripts[@]}"
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/wsl/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }
      - name: Secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: noetic, image: 'ubuntu:20.04' }
          - { distro: jazzy, image: 'ubuntu:24.04' }
    steps:
      - uses: actions/checkout@v5
      - name: Install and test ${{ matrix.distro }}
        run: docker run --rm -v "$PWD:/src:ro" ${{ matrix.image }} bash /src/ci/native.sh ${{ matrix.distro }}

  distrobox:
    needs: changes
    if: needs.changes.outputs.distrobox == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [noetic, jazzy]
    steps:
      - uses: actions/checkout@v5
      - name: Install distrobox and podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq distrobox podman
      - name: Create the box
        run: bash install.sh distrobox ${{ matrix.distro }}
      - name: Smoke test
        run: |
          box=ros-${{ matrix.distro }}
          test=$PWD/ros/${{ matrix.distro }}/smoke-test.sh
          distrobox enter "$box" -- bash "$test" || distrobox enter "$box" -- bash "$test"

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The ROS image with Gazebo is over 4 GB: better not to run short of disk
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: docker/noetic
          load: true
          tags: ros-envs-noetic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Without a password it must refuse to start
        run: |
          if docker run --rm ros-envs-noetic:ci; then exit 1; fi
      - name: Start the container
        run: |
          docker run -d --name ros -e PASSWORD=ci -e CONTAINER_USER=ros -v "$PWD:/src:ro" --shm-size=1g ros-envs-noetic:ci
          timeout 120 bash -c 'until docker exec ros curl -fsS -o /dev/null http://localhost:8443/healthz; do sleep 2; done'
          timeout 60 bash -c 'until docker exec ros curl -fsS -o /dev/null http://localhost:6080/vnc.html; do sleep 2; done'
      - name: Smoke test
        run: |
          docker exec -u ros ros bash /src/ros/noetic/smoke-test.sh || docker exec -u ros ros bash /src/ros/noetic/smoke-test.sh
      - name: Container logs
        if: failure()
        run: docker logs ros

  # Still to be proven on hosted runners, so it does not hold back the other jobs: see Testing in the README
  wsl:
    needs: changes
    if: needs.changes.outputs.wsl == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        distro: [noetic, jazzy]
    steps:
      - uses: actions/checkout@v5
      - name: Install ${{ matrix.distro }} through wsl/install.ps1
        shell: pwsh
        run: |
          wsl.exe --update
          .\wsl\install.ps1 -Distro ${{ matrix.distro }} -User ci -WslVersion 1 -Ref ${{ github.sha }} -NoPassword
