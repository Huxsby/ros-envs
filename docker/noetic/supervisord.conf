[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry %(ENV_VNC_GEOMETRY)s -depth 24 -localhost -AlwaysShared %(ENV_VNC_SECURITY)s
user=%(ENV_CONTAINER_USER)s
environment=HOME="%(ENV_USER_HOME)s",USER="%(ENV_CONTAINER_USER)s"
autorestart=true
priority=10

[program:openbox]
command=/usr/bin/openbox
user=%(ENV_CONTAINER_USER)s
environment=HOME="%(ENV_USER_HOME)s",USER="%(ENV_CONTAINER_USER)s",DISPLAY=":1"
autorestart=true
priority=20

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5901
autorestart=true
priority=30

[program:code-server]
command=/usr/local/bin/code-server --bind-addr 0.0.0.0:8443 --auth password --disable-telemetry %(ENV_USER_HOME)s/projects
directory=%(ENV_USER_HOME)s
user=%(ENV_CONTAINER_USER)s
environment=HOME="%(ENV_USER_HOME)s",USER="%(ENV_CONTAINER_USER)s",SHELL="/bin/bash",DISPLAY=":1"
autorestart=true
priority=40
